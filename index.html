<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Perkemahan Pramuka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Outfit:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff3d6;--ink:#5e2d14;--rust:#a65227;--rust-ink:#fff3d6;--mint:#a0f0e8;--leaf:#6fb84a;--card:#fffaf0;--line:rgba(94,45,20,.18);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241108;--ink:#ffe9c2;--rust:#b95d2e;--rust-ink:#fff3d6;--mint:#1d5a55;--leaf:#8fd66b;--card:#331a0e;--line:rgba(255,233,194,.2)}}
:root[data-theme="dark"]{--bg:#241108;--ink:#ffe9c2;--rust:#b95d2e;--rust-ink:#fff3d6;--mint:#1d5a55;--leaf:#8fd66b;--card:#331a0e;--line:rgba(255,233,194,.2)}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:400 17px/1.55 Outfit,system-ui,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:0 20px}
section{padding:36px 0}
h1,h2{font-family:Anton,Impact,sans-serif;font-weight:400;line-height:.95;letter-spacing:.01em}
.hero{padding:44px 0 30px;position:relative;overflow:hidden}
.hero h1 span{display:block}
.hero .a{font-size:clamp(46px,14vw,92px)}
.hero .b{font-size:clamp(72px,24vw,170px);color:var(--rust);line-height:.88}
.tag{margin-top:18px;background:var(--ink);color:var(--bg);padding:14px 18px;border-radius:12px;font-size:18px;text-align:center}
.count{margin-top:14px;display:flex;align-items:baseline;gap:10px;justify-content:center;font-weight:500}
.count b{font:400 44px/1 Anton,sans-serif;color:var(--rust)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.fact svg{width:38px;height:38px;fill:var(--rust);margin-bottom:6px}
.fact h2{font-size:22px;margin-bottom:4px}
.fact p{font-size:18px}
h2.sec{font-size:34px;margin-bottom:16px}
.list{list-style:none;padding:0;display:grid;gap:12px}
.list li{background:var(--rust);color:var(--rust-ink);border-radius:18px;padding:16px 18px}
.list h3{font-size:19px;font-weight:700;line-height:1.25}
.list p{margin-top:2px;opacity:.95}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips span{background:rgba(255,243,214,.2);border-radius:99px;padding:3px 12px;font-size:15px;font-weight:500}
.note{background:var(--ink);color:var(--bg);border-radius:18px;padding:20px}
.note h2{font-size:26px;margin-bottom:6px}
.note strong{color:var(--mint)}
.contacts{display:grid;gap:10px;margin-top:6px}
.contacts a{display:flex;justify-content:space-between;align-items:center;gap:12px;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-weight:500}
.contacts a:focus-visible,button:focus-visible{outline:3px solid var(--leaf);outline-offset:2px}
.contacts small{color:var(--rust);font-weight:700;font-size:15px}
.social{background:var(--mint);border-radius:18px;padding:16px 18px;margin-top:18px}
.social b{font-size:19px}
.poster{display:block;width:100%;border:0;background:none;padding:0;cursor:zoom-in;border-radius:16px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.poster img{display:block;width:100%;height:auto}
.hint{margin-top:8px;font-size:15px;opacity:.75;text-align:center}
dialog{border:0;background:#000;padding:0;max-width:100vw;max-height:100vh;width:100%;height:100%}
dialog::backdrop{background:#000}
dialog .in{height:100%;overflow:auto;display:flex;justify-content:center}
dialog img{width:min(100%,900px);height:auto;align-self:flex-start}
dialog button{position:fixed;top:max(12px,env(safe-area-inset-top));right:14px;font:700 16px Outfit;padding:10px 18px;border-radius:99px;border:0;background:#fff3d6;color:#5e2d14}
footer{padding:26px 0 40px;text-align:center;font-size:15px;opacity:.7}
@media (max-width:460px){.facts{grid-template-columns:1fr}}

:root{--bg2:#ffe3a6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg2:#3b1d0e}}
:root[data-theme="dark"]{--bg2:#3b1d0e}
body{background:linear-gradient(135deg,var(--bg),var(--bg2),var(--bg));background-size:300% 300%;animation:shift 20s ease-in-out infinite}
@keyframes shift{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.timer,header,main,footer{position:relative;z-index:1}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--ink);z-index:30}
.timer{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);color:var(--bg);padding:8px 12px 10px;text-align:center}
.timer .lbl{display:block;font-size:14px;opacity:.85}
.cells{display:flex;justify-content:center;gap:12px}
.cells div{min-width:60px;font-size:13px;line-height:1.1}
.cells b{display:block;font:400 30px/1.05 Anton,sans-serif;font-variant-numeric:tabular-nums;color:var(--mint)}
.hero .tag{animation:rise 1s .2s both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.wa{background:#25d366;color:#053b1a;font-weight:700;border-radius:99px;padding:6px 14px;font-size:15px;white-space:nowrap}
.contacts small{display:block}
.lead{margin:-6px 0 14px;opacity:.85}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gal .zoom{border:0;padding:0;background:none;border-radius:14px;overflow:hidden;cursor:zoom-in;box-shadow:0 0 0 1px var(--line)}
.gal .zoom img{display:block;width:100%;height:100%;object-fit:cover}
.gal .wide{grid-column:1/-1;aspect-ratio:16/9}
.gal .tall{aspect-ratio:3/4}
@media (prefers-reduced-motion:reduce){body{animation:none}.hero .tag{animation:none}}

.fact{padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.social{margin:0;text-align:left}
footer{opacity:1;padding:10px 0 40px;text-align:left}
.zt{cursor:zoom-in;transition:transform .2s}
.zt:hover{transform:scale(1.02)}.zt:active{transform:scale(.98)}
.zt:focus-visible{outline:3px solid var(--leaf);outline-offset:3px}
.lb{position:fixed;inset:0;z-index:60;background:rgba(20,8,2,0);transition:background .46s,backdrop-filter .46s;cursor:zoom-out}
.lb.on{background:rgba(20,8,2,.84);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.lbn{position:fixed!important;z-index:62;margin:0!important;transition:left .46s cubic-bezier(.2,.8,.2,1),top .46s cubic-bezier(.2,.8,.2,1),width .46s cubic-bezier(.2,.8,.2,1),height .46s cubic-bezier(.2,.8,.2,1),transform .46s cubic-bezier(.2,.8,.2,1);box-shadow:0 24px 70px rgba(0,0,0,.5);animation:none!important;touch-action:pinch-zoom}
img.lbn{border-radius:14px;object-fit:cover}
.lbx{position:fixed;top:max(12px,env(safe-area-inset-top));right:14px;z-index:70;font:700 16px Outfit,sans-serif;padding:10px 18px;border-radius:99px;border:0;background:#fff3d6;color:#5e2d14;opacity:0;transition:opacity .4s}
.lb.on .lbx{opacity:1}
#boot{padding:60px 20px;text-align:center}
@media (prefers-reduced-motion:reduce){.lb,.lbn,.lbx{transition:none}}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="timer" role="timer"><span class="lbl" id="tl"></span><div class="cells" id="cells"><div><b id="td">0</b>hari</div><div><b id="th">00</b>jam</div><div><b id="tm">00</b>menit</div><div><b id="ts">00</b>detik</div></div></div>
<header class="hero"><div class="wrap"><h1><span class="a" id="t1"></span><span class="b" id="t2"></span></h1><p class="tag" id="tag"></p></div></header>
<main id="app"><p id="boot">Memuat…</p></main>
<footer><div class="wrap" id="foot"></div></footer>
<script>
(async function(){
  const $=id=>document.getElementById(id), ns='http://www.w3.org/2000/svg';
  const h=(tag,cls,kids,attrs)=>{const e=document.createElement(tag);if(cls)e.className=cls;[].concat(kids==null?[]:kids).forEach(k=>e.append(k));if(attrs)for(const k in attrs)e.setAttribute(k,attrs[k]);return e};
  const ico=d=>{const s=document.createElementNS(ns,'svg');s.setAttribute('viewBox','0 0 24 24');s.setAttribute('aria-hidden','true');const p=document.createElementNS(ns,'path');p.setAttribute('d',d);s.append(p);return s};
  const sec=(title,...n)=>h('section',null,h('div','wrap',[title?h('h2','sec',title):null,...n]));
  let D;
  try{const r=await fetch('data.json',{cache:'no-cache'});if(!r.ok)throw new Error('HTTP '+r.status);D=await r.json()}
  catch(e){$('boot').textContent='Gagal memuat data.json ('+e.message+'). Buka lewat server (mis. Vercel atau npx serve), bukan klik dua kali file-nya.';return}
  const E=D.event;document.title=D.site.title;
  $('t1').textContent=E.title1;$('t2').textContent=E.title2;$('tag').textContent=E.tagline;$('tag').dataset.zoom=1;
  const app=$('app');app.textContent='';
  const facts=h('div','wrap facts',[
    h('div','fact',[ico('M7 2a1 1 0 0 1 1 1v1h8V3a1 1 0 1 1 2 0v1h1a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h1V3a1 1 0 0 1 1-1Zm12 8H5v10h14V10Z'),h('h2',null,'Pelaksanaan acara'),h('p',null,E.dateLabel)],{'data-zoom':1}),
    h('div','fact',[ico('M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z'),h('h2',null,'Lokasi acara'),h('p',null,E.location)],{'data-zoom':1})]);
  app.append(h('section',null,facts));
  app.append(sec(D.categoriesTitle,h('ul','list',D.categories.map(c=>h('li',null,[h('h3',null,c.name),h('p',null,c.desc),h('div','chips',c.chips.map(x=>h('span',null,x)))],{'data-zoom':1})))));
  const N=D.note;app.append(sec(null,h('div','note',[h('h2',null,N.title),h('p',null,[N.before,h('strong',null,N.highlight),N.after])],{'data-zoom':1})));
  app.append(sec(D.contactsTitle,h('p','lead',D.contactsLead),h('div','contacts',D.contacts.map(c=>
    h('a',null,[h('span',null,[c.display,h('small',null,'Pembina '+c.name)]),h('span','wa','Chat WhatsApp')],{href:'https://wa.me/'+c.phone+'?text='+encodeURIComponent(D.waMessage),target:'_blank',rel:'noopener'})))));
  app.append(sec(D.galleryTitle,h('div','gal',D.gallery.map(g=>h('button','zoom '+g.layout,h('img',null,null,{src:g.src,alt:g.alt,loading:'lazy'}),{'aria-label':'Perbesar foto'})))));
  app.append(sec(D.posterTitle,h('button','poster',h('img',null,null,{src:D.poster.src,alt:D.poster.alt,loading:'lazy'}),{'aria-label':'Perbesar poster'}),h('p','hint','Ketuk poster atau foto untuk memperbesar')));
  const S=D.social,soc=h('div','social',[h('b',null,S.title)]);
  S.items.forEach(s=>{soc.append(h('br'),s.platform+': '+s.handle)});soc.dataset.zoom=1;$('foot').append(soc);

  /* timer */
  const T=new Date(E.dateISO).getTime(),p2=n=>String(n).padStart(2,'0');
  function tick(){const s=Math.floor((T-Date.now())/1000);
    if(s>0){$('tl').textContent=D.timer.label;$('td').textContent=Math.floor(s/86400);$('th').textContent=p2(Math.floor(s%86400/3600));$('tm').textContent=p2(Math.floor(s%3600/60));$('ts').textContent=p2(s%60)}
    else{$('cells').hidden=true;$('tl').textContent=s>-86400?D.timer.today:D.timer.after}}
  tick();setInterval(tick,1000);

  /* zoom animasi untuk gambar dan teks */
  let lb=null;
  function openZoom(el){
    if(lb)return;
    const r=el.getBoundingClientRect(),isImg=el.tagName==='IMG',vw=innerWidth,vh=innerHeight,fast=matchMedia('(prefers-reduced-motion:reduce)').matches,dur=fast?0:480;
    const ov=h('div','lb'),x=h('button','lbx','Tutup');let node,mount,go,back;
    if(isImg){
      node=mount=h('img','lbn',null,{src:el.currentSrc||el.src,alt:el.alt});
      const ar=el.naturalWidth/el.naturalHeight,w=Math.min(vw*.96,vh*.88*ar),hh=w/ar,L=(vw-w)/2,Tp=(vh-hh)/2;
      node.style.cssText=`left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px`;
      go=()=>{node.style.left=L+'px';node.style.top=Tp+'px';node.style.width=w+'px';node.style.height=hh+'px'};
      back=()=>{const q=el.getBoundingClientRect();node.style.left=q.left+'px';node.style.top=q.top+'px';node.style.width=q.width+'px';node.style.height=q.height+'px'};
    }else{
      mount=el.parentElement.cloneNode(false);mount.removeAttribute('id');mount.style.display='contents';
      node=el.cloneNode(true);node.classList.add('lbn');node.classList.remove('zt');['data-zoom','tabindex','role'].forEach(a=>node.removeAttribute(a));
      node.style.cssText=`left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;transform-origin:0 0`;
      const s=Math.min(1.8,vw*.92/r.width,vh*.85/r.height),tx=(vw-r.width*s)/2-r.left,ty=(vh-r.height*s)/2-r.top;
      go=()=>{node.style.transform=`translate(${tx}px,${ty}px) scale(${s})`};back=()=>{node.style.transform='none'};
      mount.append(node);
    }
    ov.append(mount,x);document.body.append(ov);document.documentElement.style.overflow='hidden';lb=ov;
    node.getBoundingClientRect();requestAnimationFrame(()=>{ov.classList.add('on');go()});
    const close=()=>{if(lb!==ov)return;lb=null;ov.classList.remove('on');back();removeEventListener('keydown',key);
      setTimeout(()=>{ov.remove();document.documentElement.style.overflow=''},dur)};
    const key=e=>{if(e.key==='Escape')close()};addEventListener('keydown',key);ov.onclick=close;
  }
  document.querySelectorAll('[data-zoom]').forEach(el=>{
    el.classList.add('zt');el.tabIndex=0;el.setAttribute('role','button');
    el.addEventListener('click',()=>openZoom(el));
    el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openZoom(el)}});
  });
  document.querySelectorAll('.zoom,.poster').forEach(b=>b.addEventListener('click',()=>openZoom(b.querySelector('img'))));

  /* latar bergerak */
  /* latar bergerak: daun jatuh + kunang-kunang */
  var c=$('bg'),x=c.getContext('2d'),W,H,L=[],F=[],cols=['#6fb84a','#8fd66b','#a65227','#d9892b'],rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
  function size(){W=c.width=innerWidth;H=c.height=innerHeight}
  size();addEventListener('resize',size);
  for(var i=0;i<32;i++)L.push({x:Math.random()*W,y:Math.random()*H,s:6+Math.random()*10,v:.25+Math.random()*.6,d:(Math.random()-.5)*.5,a:Math.random()*6.28,r:(Math.random()-.5)*.03,c:cols[i%4],ph:Math.random()*6.28});
  for(i=0;i<14;i++)F.push({x:Math.random()*W,y:Math.random()*H,ph:Math.random()*6.28,sp:.2+Math.random()*.4});
  function draw(t){
    x.clearRect(0,0,W,H);
    L.forEach(function(q){
      q.y+=q.v;q.x+=Math.sin(t/1500+q.ph)*.5+q.d;q.a+=q.r;
      if(q.y>H+20){q.y=-20;q.x=Math.random()*W}if(q.x>W+20)q.x=-20;if(q.x<-20)q.x=W+20;
      x.save();x.translate(q.x,q.y);x.rotate(q.a);x.globalAlpha=.35;x.fillStyle=q.c;x.beginPath();x.ellipse(0,0,q.s,q.s*.4,0,0,6.283);x.fill();x.restore();
    });
    F.forEach(function(f){
      f.x+=Math.sin(t/2000+f.ph)*f.sp;f.y+=Math.cos(t/2600+f.ph)*f.sp;
      var a=.25+.45*Math.abs(Math.sin(t/900+f.ph));
      x.globalAlpha=a;x.fillStyle='#ffd35c';x.shadowColor='#ffb703';x.shadowBlur=12;x.beginPath();x.arc(f.x,f.y,2.4,0,6.283);x.fill();x.shadowBlur=0;
    });
    x.globalAlpha=1;
    if(!rm)requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
